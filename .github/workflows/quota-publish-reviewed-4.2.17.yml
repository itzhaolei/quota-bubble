name: Publish reviewed Quota Bubble 4.2.17

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quota-publish-reviewed-4.2.17
  cancel-in-progress: false

jobs:
  publish-reviewed-draft:
    if: github.repository == 'itzhaolei/quota-bubble' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify the reviewed draft and publish it once
        env:
          QUOTA_PUBLISH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = 'itzhaolei/quota-bubble'
          RELEASE_ID = 405976301
          TAG = 'v4.2.17'
          SOURCE_SHA = 'e3cac85defc97c6366ce214dc43e6039de16b295'
          NOTES_SHA256 = 'c03b266193742aa9d70de283fa7fc1cb44d51b44a5c1246daa83b7486bf01167'
          EXPECTED = {
              'QuotaBubble-4.2.17-macOS-Installer.zip': (619259611, 21406641, '45aac9dd99535ebc7eb2285c94bf5fc5f4ee921d18ce9e1c6d18130a88c925cb'),
              'QuotaBubble-4.2.17-macOS.dmg': (619259613, 24248669, 'dd3c6a689a62ab45498f641fe357da7865c4c29d18326c8a254e320564b23227'),
              'QuotaBubble-4.2.17-Windows-Setup.exe': (619259612, 13381383, 'c4d4c5256fa3b1fb9a257017fcf422d35d44c2f5d8b8ff41ab4787d325aedaec'),
              'QuotaBubble-4.2.17-Windows.zip': (619259602, 12591706, 'e576a4852f4e7d7cbacb62b070624b4d6cb050365050baf354121af96c5fb641'),
          }
          API = 'https://api.github.com'
          TOKEN = os.environ['QUOTA_PUBLISH_TOKEN']

          class SafeFailure(Exception):
              pass

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(
              NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context())
          )

          def api(path, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(API + path, data=data, method=method, headers={
                  'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SafeFailure('Release API returned HTTP ' + str(error.code)) from None
              except Exception:
                  raise SafeFailure('Release API request did not complete') from None

          def verify_release(release):
              if (release.get('id') != RELEASE_ID or release.get('tag_name') != TAG or
                  release.get('name') != 'Quota Bubble v4.2.17' or
                  release.get('prerelease') is not False or
                  release.get('draft') not in (True, False)):
                  raise SafeFailure('Release identity does not match the reviewed draft')
              body = release.get('body') or ''
              if (hashlib.sha256(body.encode()).hexdigest() != NOTES_SHA256 or
                  'Built from source `' + SOURCE_SHA + '`' not in body):
                  raise SafeFailure('Release notes do not match the reviewed source')
              assets = release.get('assets')
              if not isinstance(assets, list) or len(assets) != len(EXPECTED):
                  raise SafeFailure('Release must contain exactly the four reviewed assets')
              if {item.get('name') for item in assets} != set(EXPECTED):
                  raise SafeFailure('Release asset names do not match')
              for item in assets:
                  asset_id, size, digest = EXPECTED[item['name']]
                  if (item.get('id') != asset_id or item.get('size') != size or
                      item.get('digest') != 'sha256:' + digest or item.get('state') != 'uploaded'):
                      raise SafeFailure('Release asset metadata does not match: ' + item['name'])

          def verify_asset(name, expected):
              asset_id, expected_size, expected_hash = expected
              asset_url = API + '/repos/' + REPO + '/releases/assets/' + str(asset_id)
              request = urllib.request.Request(asset_url, headers={
                  'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/octet-stream',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  try:
                      response = opener.open(request, timeout=60)
                  except urllib.error.HTTPError as redirect:
                      if redirect.code not in (301, 302, 303, 307, 308):
                          raise SafeFailure('Asset download returned HTTP ' + str(redirect.code)) from None
                      url = redirect.headers.get('Location', '')
                      parsed = urllib.parse.urlparse(url)
                      if parsed.scheme != 'https' or parsed.hostname != 'release-assets.githubusercontent.com':
                          raise SafeFailure('Asset download redirect was not a trusted GitHub host')
                      # Never forward the repository token to the signed asset URL.
                      response = opener.open(urllib.request.Request(url), timeout=60)
                  digest = hashlib.sha256()
                  received = 0
                  with response:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          received += len(chunk)
                          if received > expected_size:
                              raise SafeFailure('Downloaded asset exceeds the reviewed size: ' + name)
                          digest.update(chunk)
                  if received != expected_size or digest.hexdigest() != expected_hash:
                      raise SafeFailure('Downloaded asset hash or size does not match: ' + name)
                  print('Verified ' + name + ': ' + str(received) + ' bytes, SHA-256 ' + expected_hash)
              except SafeFailure:
                  raise
              except Exception:
                  raise SafeFailure('Asset verification did not complete: ' + name) from None

          def main():
              path = '/repos/' + REPO + '/releases/' + str(RELEASE_ID)
              release = api(path)
              verify_release(release)
              for name, expected in EXPECTED.items():
                  verify_asset(name, expected)
              # Recheck immutable reviewed identities immediately before the one mutation.
              current = api(path)
              verify_release(current)
              if current['draft']:
                  api(path, method='PATCH', payload={'draft': False, 'make_latest': 'true'})
              else:
                  print('The reviewed release is already published; no mutation was sent.')
              published = api(path)
              verify_release(published)
              if published['draft'] or not published.get('published_at'):
                  raise SafeFailure('The reviewed release was not confirmed published')
              for attempt in range(5):
                  latest = api('/repos/' + REPO + '/releases/latest')
                  if latest.get('id') == RELEASE_ID and latest.get('tag_name') == TAG:
                      break
                  if attempt == 4:
                      raise SafeFailure('The reviewed release was not confirmed as latest')
                  time.sleep(2)
              print('Confirmed published latest release: https://github.com/' + REPO + '/releases/tag/' + TAG)

          try:
              main()
          except SafeFailure as error:
              # Do not emit raw API bodies, redirect URLs, headers, tokens or tracebacks.
              print('::error::' + str(error))
              sys.exit(1)
          except Exception:
              print('::error::Reviewed release publishing did not complete')
              sys.exit(1)
          PY
