name: Quota product Windows runner check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Standard Windows runner availability
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check Windows and Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) {
            throw 'Visual Studio discovery is unavailable.'
          }
          $installation = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) {
            throw 'Visual Studio C++ build tools are unavailable.'
          }
          Write-Output "Visual Studio C++ installation: $installation"
          $msbuild = Join-Path $installation 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild /version /nologo
          if ($LASTEXITCODE -ne 0) {
            throw 'MSBuild version check failed.'
          }
